name: QEMU Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - emu-3.1-release

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: emu-3.1-release
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            python3 \
            python3-pip \
            curl \
            wget \
            unzip \
            zip \
            rsync \
            pkg-config \
            libncurses5-dev \
            lib32z1 \
            lib32stdc++6 \
            ninja-build \
            cmake \
            clang \
            lld

      - name: Prepare build
        run: |
          chmod +x android/configure.sh
          chmod +x android/rebuild.sh

          mkdir -p "$GITHUB_WORKSPACE/objs"
          mkdir -p "$GITHUB_WORKSPACE/prebuilts"

      - name: Configure
        run: |
          ./android/configure.sh \
            --out-dir="$GITHUB_WORKSPACE/objs" \
            --aosp-prebuilts-dir="$GITHUB_WORKSPACE/prebuilts" \
            --gles=dgl \
            --verbose \
            --verbosity=2 \
            --no-tests

      - name: Build
        run: |
          ./android/rebuild.sh \
            --out-dir="$GITHUB_WORKSPACE/objs" \
            --no-tests

      - name: Find outputs
        if: always()
        run: |
          echo "===== APK ====="
          find . -type f -name "*.apk" -print || true

          echo "===== QEMU ====="
          find . -type f \
            \( -name "qemu-system-*" -o -name "emulator" \) \
            -print || true

          echo "===== OBJS ====="
          find objs -maxdepth 5 -type f 2>/dev/null | head -200 || true

      - name: Upload QEMU build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-android-build
          path: |
            **/*.apk
            **/qemu-system-*
            **/emulator
            objs/**
          if-no-files-found: warn
          compression-level: 6
